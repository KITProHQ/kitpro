<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>{{.Title}}</title><link rel="stylesheet" href="/assets/kitpro.css"></head>
<body class="auth-page"><main class="auth-card"><div class="auth-brand"><span class="brand-mark" aria-hidden="true">K</span><span><span class="brand-name">KITPro</span><span class="brand-product">Server</span></span></div><p class="eyebrow">{{.Eyebrow}}</p><h1>{{.Heading}}</h1><p>{{.Description}}</p>{{if .Error}}<div class="form-error" role="alert">{{.Error}}</div>{{end}}<form method="post">{{if .NeedsCurrentPassword}}<div class="field"><label for="current-password">Current password</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required></div>{{end}}{{if .NeedsUsername}}<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>{{end}}<div class="field"><label for="password">{{.PasswordLabel}}</label><input id="password" name="{{.PasswordName}}" type="password" autocomplete="{{.PasswordAutocomplete}}" {{if .MinimumLength}}minlength="12" maxlength="72"{{end}} required {{if not .NeedsUsername}}autofocus{{end}}>{{if .MinimumLength}}<p class="field-help">Use at least 12 characters.</p>{{end}}</div>{{if .CSRF}}<input type="hidden" name="csrf_token" value="{{.CSRF}}">{{end}}<button class="button button-primary auth-submit" type="submit">{{.SubmitLabel}}</button></form><p class="ownership-note">{{.Footer}}</p></main></body>
</html>
